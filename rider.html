<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chuto - রাইডার পোর্টাল</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SweetAlert2 for Popups -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
    }
    .mobile-shell {
      max-width: 440px;
      margin: 0 auto;
      min-height: 100vh;
      background-color: #ffffff;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      position: relative;
    }
    .app-page {
      display: none;
      width: 100%;
      min-height: 100vh;
    }
    .app-page.active {
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>

  <div class="mobile-shell">

    <!-- A. RIDER REGISTER (Opens First) -->
    <div id="page-register" class="app-page active p-6 justify-center">
      <div class="w-full max-w-sm mx-auto space-y-5">
        <div class="text-center space-y-1">
          <div class="inline-flex items-center justify-center w-11 h-11 rounded-full bg-blue-50 text-blue-600 mb-1">
            <i class="fa-solid fa-motorcycle text-xl"></i>
          </div>
          <h1 class="text-xl font-bold text-gray-900">Chuto রাইডার অ্যাকাউন্ট</h1>
          <p class="text-xs text-gray-500">রাইড শেয়ার বা ডেলিভারি দিয়ে আয় করুন</p>
        </div>

        <div class="space-y-4">
          <!-- Photo Upload Button -->
          <div class="flex flex-col items-center justify-center">
            <label for="r-avatar" class="cursor-pointer relative group">
              <div id="avatar-preview" class="w-16 h-16 rounded-full bg-gray-50 border border-gray-200 flex items-center justify-center overflow-hidden hover:border-blue-500 transition-all">
                <i class="fa-solid fa-camera text-gray-400 text-sm"></i>
              </div>
            </label>
            <input type="file" id="r-avatar" accept="image/*" class="hidden">
            <span class="text-[10px] text-gray-400 mt-1.5">প্রোফাইল ছবি (আবশ্যক)</span>
          </div>

          <!-- Input Fields -->
          <div class="space-y-3 text-xs">
            <div>
              <label class="block text-gray-500 mb-1 font-medium">আপনার নাম</label>
              <input type="text" id="r-name" placeholder="পুরো নাম" class="w-full px-3 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:border-blue-500">
            </div>

            <div>
              <label class="block text-gray-500 mb-1 font-medium">রাইডারের ক্যাটাগরি</label>
              <select id="r-category" class="w-full px-3 py-2.5 bg-white border border-gray-200 rounded-lg focus:outline-none focus:border-blue-500 text-gray-600">
                <option value="">নির্বাচন করুন</option>
                <option value="ride">রাইড শেয়ারিং (মানুষ পরিবহন)</option>
                <option value="delivery">ফুড ও গ্রোসারি ডেলিভারি</option>
              </select>
            </div>

            <div id="vehicle-specs" class="space-y-3 hidden">
              <div>
                <label class="block text-gray-500 mb-1 font-medium">যানবাহনের ধরণ</label>
                <select id="r-vehicle" class="w-full px-3 py-2.5 bg-white border border-gray-200 rounded-lg focus:outline-none focus:border-blue-500 text-gray-600">
                  <option value="Honda">হোন্ডা / বাইক</option>
                  <option value="Auto">অটো রিক্সা</option>
                  <option value="CNG">সিএনজি</option>
                </select>
              </div>
              <div>
                <label class="block text-gray-500 mb-1 font-medium">যানবাহনের প্লেট নম্বর / মডেল</label>
                <input type="text" id="r-plate" placeholder="উদা: ঢাকা মেট্রো হ-১২৩৪" class="w-full px-3 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:border-blue-500">
              </div>
            </div>
            
            <div>
              <label class="block text-gray-500 mb-1 font-medium">মোবাইল নাম্বার</label>
              <input type="tel" id="r-phone" placeholder="০১৭xxxxxxxx" class="w-full px-3 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:border-blue-500">
            </div>

            <div>
              <label class="block text-gray-500 mb-1 font-medium">পাসওয়ার্ড তৈরি করুন</label>
              <input type="password" id="r-password" placeholder="কমপক্ষে ৬ সংখ্যার" class="w-full px-3 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:border-blue-500">
            </div>

            <!-- Granular Location -->
            <div class="bg-gray-50 p-3.5 rounded-xl border border-gray-100 space-y-2.5 mt-2">
              <p class="text-[11px] font-bold text-gray-600 border-b pb-1">রাইডারের স্থায়ী ঠিকানা</p>
              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-[10px] text-gray-400 mb-0.5">জেলা</label>
                  <select id="r-district" class="w-full px-2 py-2 bg-white border border-gray-200 rounded-md text-gray-600">
                    <option value="Patuakhali">পটুয়াখালী</option>
                  </select>
                </div>
                <div>
                  <label class="block text-[10px] text-gray-400 mb-0.5">উপজেলা</label>
                  <select id="r-upazila" class="w-full px-2 py-2 bg-white border border-gray-200 rounded-md text-gray-600">
                    <option value="Bauphal">বাউফল</option>
                  </select>
                </div>
              </div>
              <div>
                <label class="block text-[10px] text-gray-400 mb-0.5">গ্রাম / ইউনিয়ন / মহল্লা</label>
                <input type="text" id="r-village" placeholder="উদা: কালাইয়া / বগা" class="w-full px-3 py-2.5 bg-white border border-gray-200 rounded-md focus:outline-none focus:border-blue-500">
              </div>
            </div>
          </div>

          <div class="pt-2">
            <button id="btn-register" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-xs transition-all shadow-sm">রাইডার নিবন্ধন করুন</button>
          </div>
          
          <div class="text-center">
            <span class="text-xs text-gray-500">ইতিমধ্যে অ্যাকাউন্ট আছে? </span>
            <button onclick="switchPage('page-login')" class="text-xs text-blue-600 font-bold hover:underline">লগইন করুন</button>
          </div>
        </div>
      </div>
    </div>

    <!-- B. RIDER LOGIN -->
    <div id="page-login" class="app-page p-6 justify-center">
      <div class="w-full max-w-sm mx-auto space-y-6">
        <div class="text-center space-y-1">
          <div class="inline-flex items-center justify-center w-11 h-11 rounded-full bg-blue-50 text-blue-600 mb-1">
            <i class="fa-solid fa-lock text-xl"></i>
          </div>
          <h1 class="text-xl font-bold text-gray-900">রাইডার লগইন</h1>
          <p class="text-xs text-gray-500">আপনার মোবাইল ও পাসওয়ার্ড দিন</p>
        </div>

        <div class="space-y-4">
          <div class="space-y-3 text-xs">
            <div>
              <label class="block text-gray-500 mb-1 font-medium">মোবাইল নাম্বার</label>
              <input type="tel" id="login-phone" placeholder="০১৭xxxxxxxx" class="w-full px-3 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:border-blue-500">
            </div>
            <div>
              <label class="block text-gray-500 mb-1 font-medium">পাসওয়ার্ড</label>
              <input type="password" id="login-password" placeholder="আপনার পাসওয়ার্ড" class="w-full px-3 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:border-blue-500">
            </div>
          </div>

          <div class="pt-2">
            <button id="btn-login" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-xs transition shadow-sm">প্রবেশ করুন</button>
          </div>

          <div class="text-center">
            <span class="text-xs text-gray-500">নতুন রাইডার? </span>
            <button onclick="switchPage('page-register')" class="text-xs text-blue-600 font-bold hover:underline">এখানে অ্যাকাউন্ট খুলুন</button>
          </div>
        </div>
      </div>
    </div>

    <!-- C. DASHBOARD (Protected View) -->
    <div id="page-dashboard" class="app-page bg-white">
      <header class="px-4 py-3 flex justify-between items-center border-b border-gray-100">
        <div class="flex items-center space-x-1.5">
          <i class="fa-solid fa-motorcycle text-blue-600 text-lg"></i>
          <span id="rider-title" class="font-bold text-sm text-gray-800">রাইডার ড্যাশবোর্ড</span>
        </div>
        <button onclick="location.reload()" class="text-red-500 text-xs font-semibold"><i class="fa-solid fa-power-off"></i> লগআউট</button>
      </header>

      <!-- Active Tasks & Job requests -->
      <div class="p-4 flex-grow overflow-y-auto space-y-4">
        <div class="flex items-center justify-between">
          <h3 class="font-bold text-gray-700 text-xs">চলতি কাজের অনুরোধ সমূহ</h3>
          <span class="inline-block bg-blue-100 text-blue-800 text-[9px] font-bold px-2 py-0.5 rounded-full">বাউফল এরিয়া</span>
        </div>
        
        <div id="jobs-list" class="space-y-3">
          <!-- Dynamic job list cards load here -->
        </div>
      </div>
    </div>

  </div>

  <!-- Firebase & Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD_HBGuQSh_GzqrHqHbgdaoBikLZsK3Qqs",
      authDomain: "new-all-f99f7.firebaseapp.com",
      databaseURL: "https://new-all-f99f7-default-rtdb.firebaseio.com",
      projectId: "new-all-f99f7",
      storageBucket: "new-all-f99f7.firebasestorage.app",
      messagingSenderId: "1069748173900",
      appId: "1:1069748173900:web:158d6336c0f4628133c8e9",
      measurementId: "G-V6DZ37WSBF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const imgbbApiKey = "4f29b88d8207f6e762c2c852d5c895f8";

    let currentRider = null;
    let riderPhoneKey = "";
    let uploadedRiderPhotoUrl = "";

    window.switchPage = function(pageId) {
      document.querySelectorAll('.app-page').forEach(p => p.classList.remove('active'));
      const target = document.getElementById(pageId);
      if(target) {
        target.classList.add('active');
        window.scrollTo(0,0);
      }
    };

    // Show vehicle input only if "Ride Sharing" category is chosen
    document.getElementById('r-category').addEventListener('change', (e) => {
      const specs = document.getElementById('vehicle-specs');
      if(e.target.value === 'ride') {
        specs.classList.remove('hidden');
      } else {
        specs.classList.add('hidden');
      }
    });

    // Profile Photo Upload
    document.getElementById('r-avatar').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if(!file) return;
      document.getElementById('avatar-preview').innerHTML = `<i class="fa-solid fa-spinner fa-spin text-blue-600 text-xs"></i>`;
      
      const formData = new FormData();
      formData.append("image", file);
      
      try {
        const res = await fetch(`https://api.imgbb.com/1/upload?key=${imgbbApiKey}`, { method: 'POST', body: formData });
        const result = await res.json();
        if(result.success) {
          uploadedRiderPhotoUrl = result.data.url;
          document.getElementById('avatar-preview').innerHTML = `<img src="${uploadedRiderPhotoUrl}" class="w-full h-full object-cover">`;
        } else {
          Swal.fire('ত্রুটি', 'ছবি আপলোড ব্যর্থ হয়েছে।', 'error');
          document.getElementById('avatar-preview').innerHTML = `<i class="fa-solid fa-camera text-gray-400"></i>`;
        }
      } catch (err) {
        console.error(err);
        Swal.fire('ত্রুটি', 'ইন্টারনেট কানেকশন চেক করুন।', 'error');
      }
    });

    // Register Rider
    document.getElementById('btn-register').addEventListener('click', async () => {
      const name = document.getElementById('r-name').value.trim();
      const category = document.getElementById('r-category').value;
      const vehicleType = document.getElementById('r-vehicle').value;
      const vehiclePlate = document.getElementById('r-plate').value.trim();
      const phone = document.getElementById('r-phone').value.trim();
      const password = document.getElementById('r-password').value.trim();
      const district = document.getElementById('r-district').value;
      const upazila = document.getElementById('r-upazila').value;
      const village = document.getElementById('r-village').value.trim();

      if(!name || !category || !phone || !password || !village || !uploadedRiderPhotoUrl) {
        Swal.fire('অসম্পূর্ণ ফর্ম', 'প্রোফাইল ছবি এবং সমস্ত তথ্য প্রদান করা বাধ্যতামূলক।', 'warning');
        return;
      }

      const snap = await get(ref(db, `riders/${phone}`));
      if(snap.exists()) {
        Swal.fire('ব্যর্থ', 'এই নাম্বারে ইতিমধ্যে অ্যাকাউন্ট রয়েছে।', 'error');
        return;
      }

      await set(ref(db, `riders/${phone}`), {
        name, category, vehicleType: category === 'ride' ? vehicleType : "", vehiclePlate: category === 'ride' ? vehiclePlate : "", phone, password, district, upazila, location: village, profilePic: uploadedRiderPhotoUrl
      });

      Swal.fire('সফল', 'রাইডার অ্যাকাউন্ট তৈরি হয়েছে।', 'success');
      switchPage('page-login');
    });

    // Login Rider
    document.getElementById('btn-login').addEventListener('click', async () => {
      const phone = document.getElementById('login-phone').value.trim();
      const password = document.getElementById('login-password').value.trim();

      if(!phone || !password) {
        Swal.fire('ত্রুটি', 'মোবাইল ও পাসওয়ার্ড লিখুন।', 'warning');
        return;
      }

      const snap = await get(ref(db, `riders/${phone}`));
      if(snap.exists() && snap.val().password === password) {
        currentRider = snap.val();
        riderPhoneKey = phone;
        setupDashboard();
      } else {
        Swal.fire('ব্যর্থ', 'মোবাইল বা পাসওয়ার্ড ভুল হয়েছে।', 'error');
      }
    });

    function setupDashboard() {
      switchPage('page-dashboard');
      document.getElementById('rider-title').innerText = currentRider.name;

      if(currentRider.category === 'ride') {
        listenRideJobs();
      } else {
        listenDeliveryJobs();
      }
    }

    // --- RIDE JOBS HANDLER ---
    function listenRideJobs() {
      onValue(ref(db, 'rides'), (snap) => {
        const listDiv = document.getElementById('jobs-list');
        listDiv.innerHTML = "";
        if(snap.exists()) {
          snap.forEach((child) => {
            const ride = child.val();
            if(ride.status === 'pending' && ride.vehicle === currentRider.vehicleType) {
              listDiv.innerHTML += `
                <div class="p-3 bg-gray-50 border border-gray-200 rounded-xl space-y-2 text-xs">
                  <p class="font-bold text-gray-800">প্যাসেঞ্জার রাইড রিকোয়েস্ট</p>
                  <p><strong>যাত্রী:</strong> ${ride.userName}</p>
                  <p><strong>রুট:</strong> ${ride.pickup} ➔ ${ride.drop}</p>
                  <p><strong>মোবাইল:</strong> ${ride.phone} | <strong>অপেক্ষা:</strong> ${ride.wait} মিনিট</p>
                  <button onclick="acceptRide('${child.key}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-1.5 rounded-md transition-all">রাইড গ্রহণ করুন (৪৫ সেকেন্ড সুযোগ)</button>
                </div>
              `;
            } else if (ride.status === 'accepted' && ride.riderPhone === riderPhoneKey) {
              listDiv.innerHTML += `
                <div class="p-3 bg-yellow-50 border border-yellow-200 rounded-xl space-y-2 text-xs shadow-sm">
                  <p class="font-bold text-yellow-800"><i class="fa-solid fa-route mr-1"></i>আপনার চলমান রাইড</p>
                  <p><strong>যাত্রী:</strong> ${ride.userName} (${ride.phone})</p>
                  <p><strong>লোকেশন:</strong> ${ride.pickup} ➔ ${ride.drop}</p>
                  <div class="grid grid-cols-2 gap-2 pt-1">
                    <button onclick="updateRideStatus('${child.key}', 'যাত্রী গাড়িতে উঠেছে')" class="bg-blue-500 text-white font-bold py-1 rounded">গাড়িতে তোলা হয়েছে</button>
                    <button onclick="completeRide('${child.key}')" class="bg-green-600 text-white font-bold py-1 rounded">রাইড শেষ ও টাকা নিয়েছি</button>
                  </div>
                </div>
              `;
            }
          });
        }
      });
    }

    window.acceptRide = async function(rideId) {
      await update(ref(db, `rides/${rideId}`), {
        status: 'accepted',
        riderName: currentRider.name,
        riderPhone: riderPhoneKey,
        riderPlate: currentRider.vehiclePlate || 'N/A',
        tripStatus: 'আসার পথে'
      });
      Swal.fire('রাইড গৃহীত', 'সফলভাবে রাইডটি গ্রহণ করেছেন। অবিলম্বে যাত্রীর ঠিকানায় যান।', 'success');
    };

    window.updateRideStatus = async function(rideId, text) {
      await update(ref(db, `rides/${rideId}`), { tripStatus: text });
      Swal.fire('আপডেট', `যাত্রী স্ট্যাটাস আপডেট: ${text}`, 'info');
    };

    window.completeRide = async function(rideId) {
      await update(ref(db, `rides/${rideId}`), { status: 'completed', tripStatus: 'completed' });
      Swal.fire('রাইড সমাপ্ত', 'রাইডটি সফলভাবে শেষ হয়েছে।', 'success');
    };

    // --- DELIVERY JOBS HANDLER ---
    function listenDeliveryJobs() {
      onValue(ref(db, 'orders'), (snap) => {
        const listDiv = document.getElementById('jobs-list');
        listDiv.innerHTML = "";
        if(snap.exists()) {
          snap.forEach((child) => {
            const order = child.val();
            if(order.status === 'delivery_broadcast') {
              listDiv.innerHTML += `
                <div class="p-3 bg-gray-50 border border-gray-200 rounded-xl space-y-2 text-xs">
                  <p class="font-bold text-gray-800">পণ্য ডেলিভারি রিকোয়েস্ট</p>
                  <p><strong>আইটেম:</strong> ${order.itemName}</p>
                  <p><strong>গ্রাহকের ঠিকানা:</strong> ${order.address}</p>
                  <button onclick="acceptDelivery('${child.key}')" class="w-full bg-blue-600 text-white font-bold py-1.5 rounded-md">ডেলিভারি শুরু করুন</button>
                </div>
              `;
            } else if (order.status === 'delivering' && order.riderPhone === riderPhoneKey) {
              listDiv.innerHTML += `
                <div class="p-3 bg-yellow-50 border border-yellow-200 rounded-xl space-y-2 text-xs">
                  <p class="font-bold text-yellow-800">ডেলিভারি প্রসেসিং (৩০ মিনিট সীমা)</p>
                  <p><strong>আইটেম:</strong> ${order.itemName} | <strong>মূল্য:</strong> ৳${order.price}</p>
                  <p><strong>গ্রাহক:</strong> ${order.userName} | <strong>ঠিকানা:</strong> ${order.address}</p>
                  <button onclick="completeDelivery('${child.key}')" class="w-full bg-green-600 text-white font-bold py-1.5 rounded-md mt-1">ডেলিভারি সফল ও ক্যাশ বুঝে পেয়েছি</button>
                </div>
              `;
            }
          });
        }
      });
    }

    window.acceptDelivery = async function(orderId) {
      await update(ref(db, `orders/${orderId}`), {
        status: 'delivering',
        riderPhone: riderPhoneKey,
        riderName: currentRider.name
      });
      Swal.fire('ডেলিভারি গৃহীত', 'অনতিবিলম্বে রেস্টুরেন্ট/দোকান থেকে পার্সেলটি সংগ্রহ করুন।', 'success');
    };

    window.completeDelivery = async function(orderId) {
      await update(ref(db, `orders/${orderId}`), { status: 'completed' });
      Swal.fire('সফল!', 'ডেলিভারিটি সফলভাবে সম্পন্ন হয়েছে।', 'success');
    };
  </script>
</body>
</html>
